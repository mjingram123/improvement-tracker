<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Improvement Tracker</title>
<meta name="description" content="Private, on-device habit and reflection tracker.">
<meta name="theme-color" content="#f3f6f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111619" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Improve">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/outfit.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" class="app">
  <main id="view" class="view" aria-live="polite"></main>
  <button class="urge-btn" data-action="urge-open" type="button">
    <svg class="urge-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12c2.5-4 5-4 7.5 0s5 4 7.5 0 3-4 5 0"/></svg>
    <span class="urge-label">Urge</span>
  </button>
  <nav class="tabs" aria-label="Sections">
    <button class="tab" data-tab="day" type="button">
      <span class="tab-pill"><svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg></span>
      <span class="tab-label">Day</span>
    </button>
    <button class="tab" data-tab="night" type="button">
      <span class="tab-pill"><svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 019.5 4 8.5 8.5 0 1020 14.5z"/></svg></span>
      <span class="tab-label">Night</span>
    </button>
    <button class="tab" data-tab="week" type="button">
      <span class="tab-pill"><svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg></span>
      <span class="tab-label">Week</span>
    </button>
    <button class="tab" data-tab="more" type="button">
      <span class="tab-pill"><svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21a9 9 0 100-18 9 9 0 000 18zM8 12h.01M12 12h.01M16 12h.01"/></svg></span>
      <span class="tab-label">More</span>
    </button>
  </nav>
  <div id="urge-overlay" class="overlay" hidden></div>
  <div id="toast" class="toast" hidden></div>
</div>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
