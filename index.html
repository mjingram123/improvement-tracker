<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Improvement Tracker</title>
<meta name="description" content="Private, on-device habit and reflection tracker.">
<meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101211" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Improve">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" class="app">
  <main id="view" class="view" aria-live="polite"></main>
  <div id="urgebar" class="urgebar">
    <button class="urge-btn" data-action="urge-open" type="button">I feel an urge</button>
  </div>
  <nav class="tabs" aria-label="Sections">
    <button class="tab" data-tab="day" type="button">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      <span class="tab-label">Day</span>
    </button>
    <button class="tab" data-tab="week" type="button">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
      <span class="tab-label">Week</span>
    </button>
    <button class="tab" data-tab="night" type="button">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
      <span class="tab-label">Night</span>
    </button>
    <button class="tab" data-tab="more" type="button">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 18h2M8 18h12M4 12h6M14 12h6"/><circle cx="14" cy="6" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></svg>
      <span class="tab-label">More</span>
    </button>
  </nav>
  <div id="urge-overlay" class="overlay" hidden></div>
  <div id="toast" class="toast" hidden></div>
</div>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
