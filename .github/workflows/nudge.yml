# Two daily check-in nudges via ntfy. Message text is fixed and generic on purpose.
# Times are America/Los_Angeles; both UTC hours are scheduled and the job picks the right one.
name: check-in nudges
on:
  schedule:
    - cron: '3 16,17 * * *'   # 9:03 local (PDT or PST)
    - cron: '3 5,6 * * *'     # 22:03 local (PDT or PST)
  workflow_dispatch:
    inputs:
      which:
        description: morning, night, or test
        default: test
jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Send nudge
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
          WHICH: ${{ github.event.inputs.which }}
        run: |
          set -e
          if [ -z "$TOPIC" ]; then echo "NTFY_TOPIC secret missing"; exit 1; fi
          H=$(TZ=America/Los_Angeles date +%-H)
          if [ -z "$WHICH" ]; then
            if [ "$H" = "9" ]; then WHICH=morning; elif [ "$H" = "22" ]; then WHICH=night; else echo "not a nudge hour locally ($H), skipping"; exit 0; fi
          fi
          case "$WHICH" in
            morning) TITLE="Morning check-in"; BODY="Stretch, then log it." ;;
            night)   TITLE="Night check-in";   BODY="Wind down and write one line." ;;
            *)       TITLE="Test";             BODY="Nudges are connected." ;;
          esac
          curl -fsS -o /dev/null \
            -H "Title: $TITLE" -H "Priority: default" -H "Tags: white_check_mark" \
            -H "Click: https://mjingram123.github.io/improvement-tracker/" \
            -d "$BODY" "https://ntfy.sh/$TOPIC"
          echo "sent: $TITLE"
